sprint_id: T1-WATCHLIST-REMINDERS
date: 2026-11-10
contract_owner: gpt_architect

context:
  intent: "시청 목록의 미공개 콘텐츠에 서버 등록·로컬 알림·오프라인 재전송을 연결한다. Phase 0.5 verdict와 잠정 플랜은 제공되지 않아 해당 판정과의 일치 여부는 미검증이다."
  scope:
    - App/Watchlist/
    - Domain/Watchlist/
    - Data/Watchlist/
    - Domain/Reminders/ 신규
    - Data/Reminders/ 신규
    - App/Settings/ 신규
    - App/ 알림 수신·상세 라우팅·앱 시작 조립 지점 신규
    - Shared/Network/APIClient.swift
    - 공개일 알림 검증 코드 및 실행 방법
  constraints:
    - 'CLAUDE.md:6 — "Clean Architecture 의존 방향은 Interactor → UseCase → Repository → Network 한 방향이다. Interactor 는 Network 계층(`APIClient`)을 직접 부르지 않는다"'
    - 'CLAUDE.md:7 — "폴더: Entity·Repository 프로토콜·UseCase 는 `Domain/{Feature}/`, DTO·Repository 구현(`Default…Repository`)은 `Data/{Feature}/` 에 둔다"'
    - 'CLAUDE.md:8 — "서버 응답을 파싱하는 타입은 `…DTO` 접미사를 쓴다(`…Response` 금지). Entity 에는 `Decodable` 을 붙이지 않는다"'
    - "CLAUDE.md:5,12-17 준수: 화면별 RIBs 4종, weak 참조 optional chaining, UI 변경 MainActor, iOS 16 호환, 새 UI SwiftUI 및 UIHostingController, 모델 소유권 wrapper, 디자인 토큰 사용."
    - "기존 목록 조회와 닫기 동작을 보존한다."
    - "전체 끄기 스위치가 켜진 동안 개별 활성화를 차단하며, 스위치를 해제해도 이전 개별 알림을 자동 복원하지 않는 것을 계약상 기본 해석으로 둔다."
    - "기존 Entity·DTO에는 공개 시각이 없다. 공개 시각의 서버 필드·단위·시간대와 POST 본문·응답·재전송 중복 처리 계약은 확정 전까지 Probe Coverage Gap으로 남긴다."
    - "설정 화면·알림 delegate·앱 진입점·상세 화면 연결은 현재 fixture에 없으므로 기존 기능으로 간주하지 않는다."
    - "CLAUDE.md:21에 따라 빌드 단계는 true로 대체한다. 이는 동작 검증 통과를 뜻하지 않는다."
    - "아래 테스트 이름은 신규 검증 명세이며 기존 테스트가 아니다. 실행 가능한 검증 환경과 실행 결과가 없으면 해당 SC는 미검증으로 남긴다."

success_criteria:
  - id: SC-1
    measurable: true
    description: "구현에 사용하는 공개 시각·reminders 요청 및 응답 계약의 미확정 필드 수가 0이다."
    verification: "계약 fixture 검사 reminderAPIContract_hasNoUnknownFields; 서버 근거와 요청·응답 예제를 대조한다."

  - id: SC-2
    measurable: true
    description: "DTO의 공개 시각을 Entity로 변환한 결과가 확정된 서버 계약의 절대 시각과 같다."
    verification: "test releaseDateMapping_matchesContractInstant; 단위·시간대 경계 표본을 사용한다."

  - id: SC-3
    measurable: true
    description: "개별 알림 활성화 가능 여부는 공개 시각이 현재보다 미래이고 전체 끄기가 해제된 항목에서만 참이다."
    verification: "test reminderEligibility_matchesTruthTable; 과거·현재·미래·공개 시각 없음과 전체 끄기 상태를 조합한다."

  - id: SC-4
    measurable: true
    description: "온라인에서 항목 알림을 켜면 확정된 본문의 POST /reminders 요청이 해당 콘텐츠 ID로 전송된다."
    verification: "test enableReminder_sendsContractPOST; 기록형 네트워크 대역의 요청을 비교한다."

  - id: SC-5
    measurable: true
    description: "온라인에서 항목 알림을 끄면 해당 콘텐츠 ID의 DELETE /reminders/{contentId} 요청이 전송된다."
    verification: "test disableReminder_sendsContentDELETE; 콘텐츠 ID의 경로 인코딩 표본을 포함한다."

  - id: SC-6
    measurable: true
    description: "알림 권한이 허용된 미공개 활성 항목의 로컬 알림 요청은 해당 공개 시각을 트리거로 사용한다."
    verification: "test enabledReminder_schedulesReleaseInstant; 주입한 시계와 알림센터 대역으로 트리거 시각을 비교한다."

  - id: SC-7
    measurable: true
    description: "서로 다른 콘텐츠 N개의 로컬 알림 식별자는 서로 다르다."
    verification: "test notificationIdentifiers_areUniquePerContent; N=1 및 N=10 표본을 검사한다."

  - id: SC-8
    measurable: true
    description: "알림 응답의 콘텐츠 ID가 앱의 상세 이동 진입점에 전달된다."
    verification: "test notificationTap_routesContentID; 실행 중·백그라운드·종료 후 시작 경로를 매개변수화한다."

  - id: SC-9
    measurable: true
    description: "오프라인에서 켠 항목의 미동기화 활성 의도가 저장소 재생성 후에도 복원된다."
    verification: "test offlineEnable_survivesStoreRecreation; 요구사항 3의 오프라인 활성화 후 프로세스 재시작 순서를 재현한다."

  - id: SC-10
    measurable: true
    description: "온라인 복귀 시 저장된 미동기화 활성 의도가 POST /reminders로 재전송된다."
    verification: "test reconnect_replaysPendingEnable; 앱 시작 시 이미 온라인인 경로와 실행 중 연결 복귀 경로를 검사한다."

  - id: SC-11
    measurable: true
    description: "오프라인에서 켜기 후 끄기를 수행한 항목은 재동기화 후 서버 알림이 비활성 상태로 수렴한다."
    verification: "test offlineEnableThenDisable_convergesDisabled; 요구사항 1·3의 연속 조작을 재현한다."

  - id: SC-12
    measurable: true
    description: "연속 토글의 서버 응답 완료 순서가 바뀌어도 최종 동기화 상태는 마지막 사용자 의도와 같다."
    verification: "test reorderedResponses_preserveLatestIntent; 켜기·끄기 요청의 완료 순서를 뒤집는다."

  - id: SC-13
    measurable: true
    description: "서버 등록 또는 해제 실패가 동기화 완료 상태로 기록되지 않는다."
    verification: "test failedMutation_remainsUnconfirmed; 연결 실패와 계약상 실패 HTTP 상태를 주입한다."

  - id: SC-14
    measurable: true
    description: "설정 화면의 전체 끄기 조작 후 이 기능이 소유한 로컬 알림 요청 수가 0이다."
    verification: "test disableAll_clearsOwnedNotifications; pending 및 delivered 요청을 대역에 미리 넣고 검사한다."

  - id: SC-15
    measurable: true
    description: "전체 끄기 후 기존 활성 항목들은 온라인 동기화 완료 시 서버에서 모두 해제된다."
    verification: "test disableAll_eventuallyDeletesEveryEnabledReminder; 온라인 및 오프라인 후 연결 복귀 순서를 검사한다."

  - id: SC-16
    measurable: true
    description: "전체 끄기 설정은 저장소 재생성 후 동일한 값으로 복원된다."
    verification: "test disableAllPreference_survivesStoreRecreation."

  - id: SC-17
    measurable: true
    description: "시청 목록에서 삭제가 성공한 항목의 이 기능 소유 로컬 알림 요청 수가 0이다."
    verification: "test watchlistRemoval_clearsOwnedNotification; pending 및 delivered 요청을 검사한다."

  - id: SC-18
    measurable: true
    description: "시청 목록에서 삭제가 성공한 항목은 온라인 동기화 완료 시 서버 알림이 해제되어 있다."
    verification: "test watchlistRemoval_eventuallyDeletesReminder; 기존 활성 등록과 미전송 활성 의도를 각각 초기 상태로 사용한다."

  - id: SC-19
    measurable: true
    description: "시청 목록 삭제 실패 시 해당 항목의 기존 알림 활성 의도가 보존된다."
    verification: "test failedWatchlistRemoval_preservesReminderIntent; WatchlistRepository.removeItem 실패를 주입한다."

  - id: SC-20
    measurable: true
    description: "알림 권한 거부 또는 로컬 예약 실패가 로컬 알림 준비 완료 상태로 표시되지 않는다."
    verification: "test notificationFailure_isNotPresentedAsReady; 사용자 활성화 경로에 권한 거부·예약 오류를 주입한다."

  - id: SC-21
    measurable: true
    description: "시청 목록 토글에서 서버 변경까지의 호출 경로가 Interactor → UseCase → Repository → APIClient 순서를 따른다."
    verification: "rg -n 'APIClient|UseCase|Repository' App Domain Data Shared/Network 후 선언·호출 연결을 대조하는 정적 검사."

  - id: SC-22
    measurable: true
    description: "추가된 설정 화면은 Builder·Router·Interactor·ViewController 네 구성요소를 가진다."
    verification: "rg --files App/Settings에서 SettingsBuilder.swift, SettingsRouter.swift, SettingsInteractor.swift, SettingsViewController.swift 존재 검사."

  - id: SC-23
    measurable: true
    description: "새 토글 UI는 UIKit 호스트에 연결된 SwiftUI View로 구현된다."
    verification: "rg -n 'UIHostingController|Toggle|StateObject|ObservedObject' App 후 View 생성부터 호스트 장착까지 정적 연결 검사."

  - id: SC-24
    measurable: true
    description: "알림 관련 UI 상태 변경은 메인 액터에서 실행된다."
    verification: "test reminderPresentation_runsOnMainActor; 조회·조작·동기화·실패 표시 경로를 검사한다."

  - id: SC-25
    measurable: true
    description: "기존 목록 조회·오류 표시·닫기의 관찰 결과가 변경 전과 동일하다."
    verification: "test watchlistExistingBehavior_isPreserved; presenter 및 listener 대역의 호출 기록을 비교한다."

anti_criteria:
  - id: AC-1
    description: "Interactor 또는 View가 APIClient를 직접 호출한다."
    detection: "rg -n 'APIClient|URLSession' App에서 적중 지점의 직접 네트워크 호출 여부를 검사한다."

  - id: AC-2
    description: "알림 재전송 상태가 화면 생명주기 또는 메모리에만 묶인다."
    detection: "SC-9·SC-10 테스트와 Builder의 의존성 수명 정적 검사로 탐지한다."

  - id: AC-3
    description: "전체 끄기·개별 끄기·항목 삭제 이후 오래된 POST가 알림을 되살린다."
    detection: "SC-11·SC-12·SC-15·SC-18 테스트에서 지연된 POST 완료 및 재시작 후 재전송을 주입한다."

  - id: AC-4
    description: "다른 기능의 로컬 알림까지 전체 삭제한다."
    detection: "관련 없는 알림 식별자를 넣은 상태에서 전체 끄기·항목 삭제 후 보존 여부를 검사하고 removeAllPendingNotificationRequests·removeAllDeliveredNotifications 호출을 검색한다."

  - id: AC-5
    description: "전체 끄기를 해제하면 이전 항목 알림을 사용자 조작 없이 복원한다."
    detection: "test disableAllThenReenable_doesNotRestoreItems에서 POST 및 로컬 예약 호출 수가 0인지 검사한다."

  - id: AC-6
    description: "HTTP 실패 또는 로컬 예약 실패를 성공한 활성 상태로 숨긴다."
    detection: "SC-13·SC-20의 실패 주입 결과와 UI 상태를 대조한다."

  - id: AC-7
    description: "Domain Entity에 Decodable을 추가하거나 서버 응답 파싱 타입에 Response 접미사를 사용한다."
    detection: "Domain의 Decodable conformance 및 신규 응답 파싱 타입 선언을 정적 검사한다."

  - id: AC-8
    description: "새 UI에서 iOS 17 전용 관찰 API를 가드 없이 사용하거나 직접 색·폰트 값을 추가한다."
    detection: "변경 파일에서 @Observable·@Bindable·Color·UIColor·Font·UIFont 적중을 추출해 가용성 가드 및 디자인 토큰 사용 여부를 검사한다."

  - id: AC-9
    description: "여러 콘텐츠의 토글을 하나의 전역 Debouncer로 합쳐 일부 항목의 변경을 유실한다."
    detection: "test multipleContents_keepIndependentIntent에서 서로 다른 두 항목을 연속 활성화한 후 각 의도가 보존되는지 검사한다."

  - id: AC-10
    description: "fixture의 true 빌드 결과나 테스트 심볼 존재만으로 동작 검증을 통과 처리한다."
    detection: "검증 보고서에서 SC별 실행 명령·종료 코드·assertion 결과를 확인하고 미실행 항목의 PASS 표기를 탐지한다."

review_pass_threshold:
  reflection_rate_min: 80
  # 결함 이슈 N<10이면 preliminary로 기록하고 Reflection Rate gating을 보류한다.
  # SC 개수는 Reflection Rate의 표본 수가 아니다.
  required_resolutions:
    - SC-1
    - SC-2
    - SC-3
    - SC-4
    - SC-5
    - SC-6
    - SC-7
    - SC-8
    - SC-9
    - SC-10
    - SC-11
    - SC-12
    - SC-13
    - SC-14
    - SC-15
    - SC-16
    - SC-17
    - SC-18
    - SC-19
    - SC-20
    - SC-21
    - SC-22
    - SC-23
    - SC-24
    - SC-25

scope_boundary:
  in_scope:
    - "공개 시각 Entity·DTO 매핑 및 개별 알림 상태 표시."
    - "서버 등록·해제와 성공 판정에 필요한 APIClient 확장."
    - "영속 미동기화 의도와 앱 시작·온라인 복귀 시 재전송."
    - "UNUserNotificationCenter 어댑터·권한 처리·예약·취소."
    - "알림 응답 수신부터 콘텐츠 상세 이동 진입점까지의 연결."
    - "설정 화면과 전체 끄기 상태의 영속화."
    - "기존 removeItem 호출을 알림 정리와 연결하는 삭제 UseCase 및 UI 진입점."
    - "신규 의존성 조립과 호출처 가시성 확인."
    - "기능 검증에 필요한 대역·검사 코드와 실행 절차."
  out_of_scope:
    - "서버 reminders 엔드포인트 자체의 구현."
    - "원격 푸시·다중 기기 동기화·새 분석 이벤트."
    - "콘텐츠 상세 화면 전체 구현과 시청 목록의 전면 재설계."
    - "기존 APIClient 전체 비동기 패턴 전환 및 무관한 네트워크 리팩터링."
    - "공용 Debouncer 재구현과 무관한 디자인 시스템 확장."
  deferred:
    - "서버 필드·응답·재전송 중복 처리 계약 확정 전에는 해당 SC의 통과를 보류한다."
    - "Phase 0.5 verdict·잠정 플랜이 제공되면 의도·writeScope·실행 경로를 대조한다. 현재 승인된 방향으로 간주하지 않는다."
    - "fixture에 없는 실행 타깃 연결 전에는 실행형 SC를 미검증으로 기록한다."
    - "실기기의 실제 공개 시각 표시·종료 상태 탭·시스템 알림 용량 한계 검증은 앱 통합 후 수행하며, 대역 테스트로 실기기 전달을 보증하지 않는다."
    - "콘텐츠 수가 시스템 예약 용량을 초과하는 경우의 지원 범위는 앱 통합 전에 확정한다."
    - "상시 백그라운드 실행이나 앱 미실행 중 즉시 서버 재전송은 별도 요구가 있을 때 검토한다."