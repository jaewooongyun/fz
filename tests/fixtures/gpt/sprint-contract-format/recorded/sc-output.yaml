sprint_id: T1-RELEASE-REMINDERS
date: "2026-11-14"
contract_owner: gpt_architect

context:
  intent: "출시일 알림 요구사항을 구현 전 검증 계약으로 정의한다. Phase 0.5 verdict는 제공되지 않아 채택 여부는 미확인이다."
  scope:
    - "Wishlist 항목 표시·토글·삭제 경로"
    - "상품 출시 시각 및 출시 여부 판정"
    - "알림 등록·해제 API 연동"
    - "알림 상태·미전송 작업의 영속 저장 및 재전송"
    - "UNUserNotificationCenter 예약·취소·응답 처리"
    - "상품 상세 라우팅 및 앱 시작 경로"
    - "설정 화면의 출시일 알림 전체 끄기 스위치"
    - "관련 테스트 및 빌드 대상"
  constraints:
    - "저장소 검색이 Operation not permitted로 실패했다. 실제 파일 경로·기존 구현·빌드 명령·테스트 타깃은 확인하지 못했다."
    - "modules/sprint-contract.md 절차 2와 modules/cross-validation.md의 본문을 읽지 못했으므로 절차 준수를 확정하지 않는다."
    - "Probe Coverage Gap: architecturePattern, uiStack, dependencyDirection, naming, placement, conventions는 모두 null이다. 특정 프로젝트 규칙이나 계층 구조를 가정하지 않는다."
    - "존재·권한/경계·결과 contract의 확인 대상은 API, 저장소, 연결 복구 감지, 알림 처리 진입점, 상세 라우터다."
    - "아래 테스트 이름은 구현 시 추가하거나 기존 테스트에 대응시킬 검증 명세이며, 현재 존재하거나 통과한 테스트라는 뜻이 아니다."
    - "전체 끄기 ON은 모든 상품의 알림 희망 상태를 OFF로 바꾸는 것으로 정의한다. 전체 끄기 OFF만으로 이전 상품 알림을 자동 복원하지 않는다."
    - "오프라인 재전송은 앱이 실행 가능한 상태에서 연결 복구를 관측하거나 다음 실행·활성화 시 수행한다."
    - "출시 시각 검증은 예약 요청의 목표 시각을 기준으로 한다. 운영체제의 실제 표시 시각에 대한 절대 보장은 성공 기준으로 삼지 않는다."
    - "기존 찜 목록 조회·삭제·상세 이동과 이번 기능 외 알림의 동작을 보존한다."
    - "실행 경로 검증표에는 온라인, 오프라인, 연결 복구, 재실행, 빠른 연속 조작, 전체 끄기, 항목 삭제, 알림 탭의 앱 상태별 경로를 포함한다."
    - "Reflection Rate 표본 N이 10 미만이면 preliminary로 기록하고 해당 비율에 의한 gating을 보류한다."

success_criteria:
  - id: SC-1
    measurable: true
    description: "출시 시각이 현재보다 미래인 찜 항목에만 출시일 알림을 새로 켤 수 있다."
    verification: "추가할 testReminderEligibility: 고정 시계로 과거·현재·미래·출시 시각 누락 항목의 활성화 가능 여부를 비교한다."

  - id: SC-2
    measurable: true
    description: "온라인에서 항목 알림을 켜면 해당 상품을 식별하는 POST /reminders 요청이 전송된다."
    verification: "추가할 testEnableSendsReminderPost: HTTP spy로 메서드·경로·상품 식별자를 검사한다."

  - id: SC-3
    measurable: true
    description: "온라인에서 항목 알림을 끄면 해당 상품의 DELETE /reminders/{productId} 요청이 전송된다."
    verification: "추가할 testDisableSendsReminderDelete: HTTP spy로 실제 productId가 포함된 메서드·경로를 검사한다."

  - id: SC-4
    measurable: true
    description: "알림 권한이 허용된 미래 출시 상품을 켜면 해당 출시 시각을 목표로 하는 로컬 알림 요청이 등록된다."
    verification: "추가할 testSchedulesAtReleaseInstant: 알림 센터 spy와 고정 시계로 예약 목표의 절대 시각을 비교한다."

  - id: SC-5
    measurable: true
    description: "동일 상품의 출시일 알림 예약은 반복 등록 후에도 하나만 존재한다."
    verification: "추가할 testRepeatedEnableDoesNotDuplicateNotification: 동일 상품을 반복 활성화한 뒤 예약 요청을 조회한다."

  - id: SC-6
    measurable: true
    description: "상품 알림을 끈 뒤 해당 상품의 로컬 알림이 남아 있지 않다."
    verification: "추가할 testDisableRemovesProductNotifications: 대기 중 알림과 이미 전달된 알림을 준비한 뒤 해당 상품의 잔존 알림 수가 0인지 검사한다."

  - id: SC-7
    measurable: true
    description: "유효한 출시일 알림을 누르면 알림이 가리키는 상품 상세가 열린다."
    verification: "추가할 testNotificationOpensMatchingProduct: 실행 중·백그라운드·종료 후 시작 경로별로 실제 알림 응답 진입점에서 최종 상세 productId를 검사한다."

  - id: SC-8
    measurable: true
    description: "오프라인에서 켠 상품의 미전송 등록 의도는 앱 저장소를 다시 열어도 복원된다."
    verification: "추가할 testOfflineEnableSurvivesRestart: 네트워크를 차단하고 활성화한 뒤 새 저장소 인스턴스에서 미전송 의도를 조회한다."

  - id: SC-9
    measurable: true
    description: "연결 복구 시 유효한 미전송 등록 의도가 서버에 재전송된다."
    verification: "추가할 testReconnectReplaysPendingEnable: 오프라인 등록 후 연결 복구 이벤트를 주입하여 POST 수신을 확인한다."

  - id: SC-10
    measurable: true
    description: "앱 시작·활성화 시 유효한 미전송 의도의 동기화가 재개된다."
    verification: "추가할 testActivationResumesPendingSync: 미전송 상태를 복원한 앱의 시작·활성화 진입점에서 전송을 확인한다."

  - id: SC-11
    measurable: true
    description: "동일 상품의 연속 변경은 요청 완료 순서와 관계없이 마지막 사용자 의도로 수렴한다."
    verification: "추가할 testLastIntentWins: ON→OFF 및 OFF→ON에서 응답 순서 역전·타임아웃·재실행을 주입하고 최종 동기화 상태를 검사한다."

  - id: SC-12
    measurable: true
    description: "재시도 가능한 전송 실패 후 해당 변경 의도가 미전송 상태로 보존된다."
    verification: "추가할 testTransientFailurePreservesPendingIntent: 연결 오류·타임아웃·재시도 대상으로 합의된 서버 응답을 주입하고 저장 상태를 검사한다."

  - id: SC-13
    measurable: true
    description: "전체 끄기를 켠 뒤 출시일 로컬 알림이 남아 있지 않다."
    verification: "추가할 testGlobalOffClearsReleaseNotifications: 여러 상품의 대기·전달 알림을 준비하고 출시일 알림의 잔존 수가 0인지 검사한다."

  - id: SC-14
    measurable: true
    description: "전체 끄기를 켠 뒤 기존 서버 등록은 연결 가능 시 모두 해제된다."
    verification: "추가할 testGlobalOffConvergesServerToEmpty: 등록 완료·미전송·전송 중 상품을 혼합하고 오프라인·재시작을 거친 뒤 가짜 서버의 등록 집합이 비어 있는지 검사한다."

  - id: SC-15
    measurable: true
    description: "전체 끄기 상태는 앱을 다시 실행해도 유지된다."
    verification: "추가할 testGlobalOffSurvivesRestart: 스위치를 켠 뒤 새 앱 상태 인스턴스에서 값을 검사한다."

  - id: SC-16
    measurable: true
    description: "전체 끄기가 켜져 있는 동안 상품별 알림 활성화가 차단된다."
    verification: "추가할 testGlobalOffBlocksEnable: UI 조작과 실제 활성화 진입점 호출 각각에서 활성화 거부 결과를 검사한다."

  - id: SC-17
    measurable: true
    description: "전체 끄기를 해제하는 동작만으로 과거 상품 알림이 재활성화되지 않는다."
    verification: "추가할 testLeavingGlobalOffDoesNotRestoreReminders: 전체 끄기를 켰다가 해제하고 활성 상품 집합이 비어 있는지 검사한다."

  - id: SC-18
    measurable: true
    description: "찜 항목 삭제 후 해당 상품의 로컬 알림이 남아 있지 않다."
    verification: "추가할 testWishlistRemovalClearsLocalReminder: 저장소에서 확인한 모든 삭제 진입점별로 해당 상품의 잔존 알림 수를 검사한다."

  - id: SC-19
    measurable: true
    description: "찜 항목 삭제 후 해당 상품의 서버 알림 등록은 연결 가능 시 해제 상태로 수렴한다."
    verification: "추가할 testWishlistRemovalConvergesServerToAbsent: 등록 완료·미전송 ON·POST 진행 중 상태에서 삭제하고 재연결·응답 역전 후 서버 등록 부재를 검사한다."

  - id: SC-20
    measurable: true
    description: "알림 권한 거부 또는 예약 실패 상태에서 UI가 로컬 알림 예약 완료를 표시하지 않는다."
    verification: "추가할 testSchedulingFailureIsNotShownAsScheduled: 권한 거부·예약 오류를 각각 주입하고 UI 상태를 검사한다."

  - id: SC-21
    measurable: true
    description: "출시일 알림 기능의 변경으로 다른 종류의 로컬 알림이 제거되지 않는다."
    verification: "추가할 testReminderCleanupPreservesOtherNotifications: 타 기능 알림을 함께 등록하고 개별 OFF·전체 끄기·찜 삭제 후 보존 여부를 검사한다."

  - id: SC-22
    measurable: true
    description: "각 상품 토글의 접근성 값이 해당 상품의 현재 알림 상태와 일치한다."
    verification: "추가할 testReminderToggleAccessibilityValue: 서로 다른 상태의 복수 상품에 대해 접근성 트리의 상품 식별과 토글 값을 비교한다."

  - id: SC-23
    measurable: true
    description: "변경이 포함된 앱 타깃이 저장소에서 지정한 빌드 명령으로 성공한다."
    verification: "저장소 열람 복구 후 지침·CI에서 실제 빌드 명령과 타깃을 확인하고 종료 코드 0을 검사한다."

anti_criteria:
  - id: AC-1
    description: "확인하지 못한 Phase 0.5 verdict나 저장소 규칙을 확인·채택한 사실로 기록하면 안 된다."
    detection: "리뷰에서 모든 채택 주장과 프로젝트 규칙 주장을 원문·파일·행 근거에 대조한다. 근거가 없으면 미확인으로 판정한다."

  - id: AC-2
    description: "API의 요청 본문·인증 범위·성공 응답·중복 등록 처리·해제 대상 부재 처리 정책을 추측으로 확정하면 안 된다."
    detection: "구현 전 API 명세 또는 서버 계약 테스트와 클라이언트를 대조한다. 미합의 항목이 있으면 구현 착수 조건 미충족으로 기록한다."

  - id: AC-3
    description: "이전 ON 재시도가 이후 OFF·전체 끄기·찜 삭제를 덮어쓰면 안 된다."
    detection: "SC-11·SC-14·SC-19에서 요청 지연과 응답 역전을 주입하고 취소된 등록의 재출현을 탐지한다."

  - id: AC-4
    description: "미전송 의도와 전체 끄기 상태를 메모리에만 저장하면 안 된다."
    detection: "SC-8·SC-10·SC-15를 새 저장소·앱 상태 인스턴스로 실행하여 복원 실패를 탐지한다."

  - id: AC-5
    description: "연결 복구 이벤트의 반복 수신이 같은 상품의 동시 중복 전송이나 종료 조건 없는 즉시 재시도를 만들면 안 된다."
    detection: "연결 복구 이벤트를 연속 주입하고 가상 시계로 요청 동시성 및 재시도 간격을 관측한다."

  - id: AC-6
    description: "출시 시각이 지난 미전송 ON이 복구 과정에서 새 알림 등록으로 실행되면 안 된다."
    detection: "오프라인 ON 후 시계를 출시 이후로 이동한 재전송 테스트에서 신규 POST·예약 요청이 발생하는지 검사한다."

  - id: AC-7
    description: "상품 N개를 처리할 때 전역 알림 식별자나 상태 공유로 상품 간 상태가 섞이면 안 된다."
    detection: "기준 데이터와 그 10배 데이터에서 일부 상품만 토글·삭제하고 다른 상품의 상태·요청·예약 변화가 없는지 검사한다."

  - id: AC-8
    description: "잘못된 알림 payload가 임의 상품으로 이동하거나 앱을 종료시키면 안 된다."
    detection: "productId 누락·잘못된 형식·존재하지 않는 상품의 알림 응답 테스트에서 안전한 종료 상태와 잘못된 상세 이동 부재를 검사한다."

  - id: AC-9
    description: "다른 계정의 미전송 알림 작업을 현재 계정 권한으로 재전송하면 안 된다."
    detection: "저장소에 계정 전환 기능이 있으면 로그아웃·계정 변경 후 복구 테스트에서 요청 소유자와 인증 주체를 비교한다. 계정 모델 미확인은 검증 공백으로 기록한다."

  - id: AC-10
    description: "출시 시각의 시간대 변환으로 예약 목표의 절대 시각이 달라지면 안 된다."
    detection: "서로 다른 기기 시간대와 날짜 경계 입력에 대해 예약 목표의 절대 시각을 원본 출시 시각과 비교한다."

review_pass_threshold:
  reflection_rate_min: 80
  required_resolutions:
    - SC-1
    - SC-2
    - SC-3
    - SC-4
    - SC-5
    - SC-6
    - SC-7
    - SC-8
    - SC-9
    - SC-10
    - SC-11
    - SC-12
    - SC-13
    - SC-14
    - SC-15
    - SC-16
    - SC-17
    - SC-18
    - SC-19
    - SC-20
    - SC-21
    - SC-22
    - SC-23

scope_boundary:
  in_scope:
    - "다섯 요구사항의 UI·서버·로컬 알림·영속 상태 연결"
    - "ON뿐 아니라 OFF·전체 끄기·찜 삭제의 오프라인 해제 의도 처리"
    - "재시작 복원·요청 순서 역전·중복 전송·실패 상태 처리"
    - "알림 응답에서 실제 앱 진입점과 상품 상세 라우터까지의 연결 검증"
    - "전체 끄기와 찜 삭제 이후 오래된 미전송 ON 및 전송 중 POST의 잔여 효과 제거"
    - "계약상 전체 끄기 의미를 Phase 0.5 판단과 대조하여 구현 전에 확정"
  out_of_scope:
    - "원격 푸시 기반 출시 알림 전환"
    - "상품 출시 시각 자체의 관리 기능"
    - "요구사항과 무관한 Wishlist·설정 화면 전면 개편"
