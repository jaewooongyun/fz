scope_boundary:
  in_scope:
    - "공개 시각 모델링과 기존 응답 호환성"
    - "항목별 켜기·끄기, 서버 등록·해제, 로컬 예약·취소"
    - "알림 권한 및 저장·네트워크·예약 실패의 사용자 표시"
    - "영속적인 최종 의도와 앱 실행·활성화·온라인 복귀 시 재동기화"
    - "전체 끄기의 로컬 정리·서버 해제·경합 방지"
    - "시청 목록 삭제 경로와 알림 해제의 결합"
    - "앱 진입점부터 알림 응답·준비 대기·상세 라우팅까지의 실제 연결"
    - "설정 화면과 상세 호스트가 없는 fixture를 위한 최소 조립·연동 경계"
    - "요구사항 1~5의 실패·경합·다중 항목 회귀 검증"
  out_of_scope:
    - "백엔드 /reminders 서비스 자체 구현"
    - "원격 푸시·위젯·이메일 알림 및 종료 앱의 즉시 재전송 보장"
    - "다중 기기 간 설정 동기화와 신규 계정 체계"
    - "콘텐츠 상세 화면의 전체 기능 구현"
    - "기존 화면 전체의 SwiftUI 전환과 전역 네트워크 계층 재작성"
    - "요구사항과 무관한 기존 코드 문제의 수정; 발견 사항은 별도 보고"
  deferred:
    - "실기기에서 OS 알림 표시·백그라운드 전달·콜드 시작을 입증하는 검증은 실제 iOS 앱 타깃 제공 후 수행한다. fixture 결과로 통과를 주장하지 않는다."
    - "접근성 UI 테스트 호스트가 제공되지 않으면 SC-29는 미검증으로 남으며 전체 계약 통과를 선언하지 않는다."
    - "API result contract와 실제 앱 연동 소유권은 구현 전 해소할 선행 공백이다. 요구사항 자체를 후속 작업으로 미루는 근거로 사용하지 않는다."
    - "운영 롤백 절차는 배포 환경 제공 후 확정한다. 알림 진입 차단 시에도 기존 예약 취소와 서버 해제 대기의 복구 경로를 보존한다."